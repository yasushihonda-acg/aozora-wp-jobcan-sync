# Jobcan public-page selectors and parsing config.
#
# This file is the single source of truth for which CSS selectors the parser
# uses, which header labels map to which normalised fields, and which HTML tags
# survive bleach sanitisation. Update this file (and the matching pytest fixtures)
# when Jobcan changes their public markup — no Python edits required.
#
# Codex review (Phase 2A) reflected:
# - Pydantic schema validates this file at load time; bad config raises ConfigError
#   (a separate class from JobcanStructureChangeError, so operators can tell
#    "we shipped a broken config" from "Jobcan changed their HTML")
# - synonyms are explicit lists, not fuzzy match — `給与例` MUST NOT map to `給与`
# - load is once at startup; `--selectors` CLI flag overrides for tests/dev only

version: 1

detail:
  selectors:
    title: ".job-offer-detail-title"
    body: ".job-offer-description-full"
    address: ".job-offer-address"
    label: ".job-offer-label"
    apply_link: 'a[href^="/aozora/entry/new/"]'
    table_lines: ".content-table-line"
    table_header: ".content-table-head, .job-offer-table-left"
    table_body: ".td-contentTable__breakWordWrap, .job-offer-table-right"
  required_table_fields:
    location:
      canonical: "勤務地"
      synonyms:
        - "勤務地"
        - "勤務地・交通"
    salary:
      canonical: "給与"
      synonyms:
        - "給与"
        - "給与（月給）"
        - "給与（時給）"
        - "月給"
        - "時給"

list:
  selectors:
    job_card: ".job-offer-box"
    job_url: 'a[href^="/aozora/job_offers/"]'
    title: ".job-offer-title"
    address: ".job-offer-address"
    label: ".job-offer-label"
    description: ".job-offer-description"
    thumbnail: ".job-offer-main-image-thumbnail"
    # Pagination is intentionally NOT required (JobcanStructureChangeError is
    # never raised for a missing pagination block): categories with <=10 jobs
    # render `.pagination-number` with a bare "N 件" count and omit
    # `.pagination-list` entirely (real fixture: list_it.html, 4 jobs).
    # `pagination_total` carries the leading integer in either "53 件中
    # 1-10 件を表示" or "4 件" — a single \d+ regex covers both formats.
    # `pagination_last_link` reads `rel="last"` rather than walking `next`
    # links one at a time, so a run is robust to "…" gap-elided middle pages.
    pagination_total: ".pagination-number"
    pagination_last_link: 'a[rel="last"]'
  # Phase 2A.1c: replace Jobcan-supplied card thumbnails with in-house
  # category illustrations that match the corporate-site (aozora-cg.com)
  # tonal manner. The original Jobcan thumbnail is preserved in
  # `JobListItem.source_thumbnail_url` for operator visibility; the override
  # writes only `JobListItem.thumbnail_url` (display).
  #
  # When `enabled: false`, the override is bypassed and Jobcan's thumbnail
  # is shown as-is — this is the documented escape hatch for the period
  # before Jobcan returns the official inquiry verdict.
  #
  # NOTE on `image` paths (code-review medium #1 — Phase 2A.2 deferred):
  # These are page-relative (`assets/img/...`) and only resolve correctly
  # when the rendered HTML and the assets share a parent. That holds for
  # the Phase A mockup (GH Pages /mockup/) and the CLI `--out` flow.
  # Phase 2A.2 (FastAPI route `/jobs/`) MUST inject a `base_url` template
  # variable so the renderer produces site-root paths (`/assets/img/...`)
  # or proxy `/static/` prefixes — otherwise the production URL
  # `recruit.aozora-cg.com/jobs/...` will 404 on these images.
  # 2026-08-10: synonyms were stale from Phase 2A.1c (only 6 labels across
  # 4 categories) and never extended when the raw-label inventory grew to
  # the full 17-category granularity (`job_types.py` JOB_TYPE_NAMES, PR
  # #157). Most real labels (including "看護職" itself — "看護師" never
  # actually appears) had no synonym entry, so `_resolve_display_thumbnail`
  # silently fell through to `default_image` for the large majority of
  # postings — every card looked like the same generic consultation scene
  # regardless of job type (decision-maker report, 2026-08-10). PR #159
  # fixed the fallthrough by mirroring the 4-bucket grouping
  # `list_sections.LABEL_TO_CATEGORY` uses for the card colour modifier
  # (care/nurse/office/it, 相談員 folded into care per PR #72) — but that
  # grouping is coarse-on-purpose for colour (only 4 CSS modifiers exist)
  # and was never meant for image selection. It buried 10 semantically
  # distinct labels under one generic "care" scene and left two
  # already-generated dedicated illustrations — illust-job-visit.png
  # (訪問介護員/ヘルパー, SCENE #14) and illust-job-consultant.png
  # (相談員/ケアマネジャー, SCENE #2) — completely unused
  # (decision-maker report, 2026-08-11: 訪問系の職種はホームヘルパーと同じ
  # 画像に揃えてほしい、という指摘). 2026-08-11: split into 6 image
  # buckets so each label lands on the closest-matching existing
  # illustration; `list_sections.LABEL_TO_CATEGORY`'s 4-colour grouping is
  # intentionally left as-is (colour ≠ image, do not re-merge these).
  # `list_sections.py` module docstring also documents this split.
  #
  # 2026-08-11 (2nd): `image` (single path) -> `images` (a pool). Every
  # category already had multiple generated illustrations sitting unused
  # (decision-maker report: every card in a category showed the literal
  # same image). Which pool member a given job_id resolves to is
  # `sha256(job_id) % len(images)` (`parser._pick_variant`) — stable
  # forever for that job_id, independent of every other job in the sync
  # run. Adding/removing/reordering entries in one category's `images`
  # list reshuffles ONLY that category's assignments; that is the one and
  # only intended trigger, and it happens on a deliberate config edit, not
  # as a side effect of a normal 6-hourly sync. `default_image` stays a
  # single image on purpose — see `ThumbnailCategoriesConfig` docstring.
  #
  # 2026-08-12: 6 -> 9 buckets. Top page (`mockup/index.html`) got three
  # dedicated illustration cards (訪問看護 / 夜勤専従（介護・看護） /
  # 施設長・管理者候補) but the `/jobs/` listing kept showing the generic
  # care/nurse scene for those labels — decision-maker report, 2026-08-11.
  # Adding the new files straight into the `care`/`nurse` pools was
  # rejected: `_resolve_display_thumbnail` resolves per-bucket, not
  # per-label, so any addition to a shared pool reshuffles EVERY label in
  # that bucket (介護職, 世話人, 看護職, ...), not just the intended one.
  # Instead each of the three labels was MOVED (not copied) out of its old
  # bucket into a new single-label bucket named after the label. The old
  # buckets' `images` lists are byte-for-byte unchanged, so every other
  # label's existing assignment is provably unchanged (pin: care category_id
  # 18773 distribution before/after this change is identical).
  # `facility-manager` ships with a 1-image pool (same situation as
  # `nurse`/`it` before this change) — a 2nd/3rd variant is a follow-up
  # (see docs/handoff/GOAL.md), not a blocker for shipping the correct
  # illustration. `night-shift`'s pool intentionally omits the generated
  # `illust-job-night-shift-3.png`: it is a night palette-swap of the SAME
  # composition as `illust-job-visiting-nurse.png` (in-home blood-pressure
  # check), so showing both in one listing reads as "same picture, day vs
  # night" rather than two distinct scenes.
  #
  # 2026-08-13: 9 -> 10 buckets, same MOVE pattern as above. `総合職（営業・
  # 管理職）` split out of `office` into its own `general` bucket with 2
  # dedicated illustrations (a presentation scene + a facility-walkthrough
  # scene). `office`'s pool (`illust-job-office.png`/`-2.png`) is otherwise
  # untouched, so 事務職/新卒・既卒総合職 assignments are unchanged.
  #
  # 2026-08-13 (2nd): 10 -> 11 buckets, same MOVE pattern. `相談員` split out
  # of `consultant` into its own `consultation` bucket with 2 dedicated
  # illustrations (SCENE #21: a facility-tour guiding scene + a one-on-one
  # intake counseling scene). Until now 相談員 shared `consultant`'s pool
  # with ケアマネジャー・計画作成担当者/サービス管理責任者, so its top-page
  # card and `/jobs/` thumbnails showed the multi-person care-plan-meeting
  # scene meant for ケアマネジャー — the exact ambiguity SCENE #21 was
  # written to resolve. `consultant`'s pool (`illust-job-consultant.png`/
  # `-2.png`) is otherwise untouched, so ケアマネジャー・計画作成担当者/
  # サービス管理責任者 assignments are unchanged.
  #
  # 2026-08-13 (3rd): 11 -> 12 buckets, same MOVE pattern. `サポート職（清掃・
  # 洗濯・調理・送迎）` split out of `care` into its own `support` bucket
  # (SCENE #23: a facility-van pickup/送迎 scene). Ships as a 1-image pool
  # (same situation as `facility-manager` before its variant follow-up) —
  # two other ChatGPT UI generations for this SCENE (清掃/洗濯 candidates)
  # were rejected: both showed a small stud earring despite the SCENE's
  # unconditional "NO earring" ACCESSORY RULE, and the 洗濯 candidate also
  # duplicated `illust-job-visit.png`'s laundry-folding motif. A 2nd/3rd
  # variant (清掃 or 調理 scene, regenerated with a more strongly-worded
  # earring rule) is a follow-up, not a blocker. `care`'s pool
  # (`illust-job-care.png`/`-2.png`/`-3.png`) is otherwise untouched, so
  # 介護職/世話人 assignments are unchanged.
  #
  # 2026-08-13 (4th): 12 -> 13 buckets, same MOVE pattern. `訪問リハビリ`
  # split out of `nurse` into its own `visiting-rehab` bucket (SCENE #24: a
  # resistance-bar exercise scene). Ships as a 1-image pool. `nurse`'s pool
  # (`illust-job-nurse.png`) is otherwise untouched, so 看護職/看護師
  # assignments are unchanged.
  #
  # 2026-08-13 (5th): 13 -> 14 buckets, same MOVE pattern. `サービス管理責任者`
  # split out of `consultant` into its own `service-manager` bucket (SCENE
  # #25: a desk-review scene with a tablet + pen + stacked binders,
  # generated 2026-08-13). Ships as a 1-image pool (same situation as
  # `facility-manager`/`support`/`visiting-rehab`) — a second ChatGPT UI
  # candidate for this SCENE (a solo corridor-walking pose) was rejected:
  # it duplicated `illust-job-general-2.png`'s composition (same
  # glass-walled corridor + reception-desk + potted-plant background, same
  # walking pose) closely enough that decision-maker judged the two
  # indistinguishable side-by-side. The adopted image's desk-review pose
  # is visually distinct from `illust-job-facility-manager.png` on
  # background/tone (open-plan office with a floor-to-ceiling city-skyline
  # window vs. facility-manager's lobby/reception with a staircase) even
  # though both feature a seated tablet+pen pose — decision-maker accepted
  # this as sufficiently distinct rather than requesting a third
  # regeneration. `consultant`'s pool (`illust-job-consultant.png`/
  # `-2.png`) is otherwise untouched, so ケアマネジャー・計画作成担当者
  # assignments are unchanged.
  #
  # 2026-08-13 (6th): 14 -> 15 buckets, same MOVE pattern. `世話人` split out
  # of `care` into its own `caretaker` bucket (SCENE #26: a group-home
  # mealtime scene, staff serving a meal tray to a seated resident).
  # Ships as a 1-image pool. A second ChatGPT UI candidate for this SCENE
  # (a bathroom/changing-room towel-handing scene) was rejected outright —
  # it depicted the exact bathing/hands-on-body-contact motif the SCENE's
  # COMPOSITION explicitly excluded, not merely a similarity to an
  # existing card. `care`'s pool (`illust-job-care.png`/`-2.png`/`-3.png`)
  # is otherwise untouched, so 介護職 assignments are unchanged.
  #
  # 2026-08-13 (7th): 15 -> 16 buckets, same MOVE pattern. `サービス提供責任者`
  # split out of `visit` into its own `service-lead` bucket (SCENE #27: a
  # 3-person intake meeting with a resident, a family member, and the
  # coordinator holding out a tablet). The SCENE's COMPOSITION had required
  # a wall-mounted route/schedule board as the central visual signature,
  # but the generated candidate omitted it entirely in favor of this
  # meeting-style scene; decision-maker accepted it anyway, judging the
  # board requirement unrealistic for a modern office (paper wall maps/
  # boards are no longer common practice) and accepting the resulting
  # visual closeness to `illust-job-consultant.png`/`illust-job-consultation.png`
  # family. Ships as a 1-image pool (same situation as `facility-manager`/
  # `support`/`visiting-rehab`/`service-manager`/`caretaker`). `visit`'s
  # pool (`illust-job-visit.png`/`-2.png`/`-3.png`) is otherwise untouched,
  # so ホームヘルパー assignments are unchanged.
  #
  # 2026-08-13 (8th, final of the 11-職種 backlog): 16 -> 17 buckets, same
  # MOVE pattern. `新卒・既卒総合職` split out of `office` into its own
  # `new-grad` bucket (SCENE #28: a solo figure in a black/charcoal suit +
  # white shirt walking through a glass-walled corporate lobby, carrying a
  # folder). Ships as a 1-image pool (same situation as `facility-manager`/
  # `support`/`visiting-rehab`/`service-manager`/`caretaker`/`service-lead`).
  # decision-maker accepted this despite a shared "solo figure walking a
  # glass corridor with city-skyline windows + potted plants" archetype with
  # `illust-job-general-2.png`, judging the suit-vs-black-polo outfit
  # difference (the established `office`-track OUTFIT VARIATION per
  # CLAUDE.md's 2026-07-02 decision) a sufficient visual/role signal.
  # `office`'s pool (`illust-job-office.png`/`-2.png`) is otherwise
  # untouched, so 事務職 assignments are unchanged.
  thumbnail_categories:
    enabled: true
    categories:
      care:
        synonyms:
          - "介護職"
        images:
          - "assets/img/illust-job-care.png"
          - "assets/img/illust-job-care-2.png"
          - "assets/img/illust-job-care-3.png"
      visit:
        synonyms:
          - "ホームヘルパー"
        images:
          - "assets/img/illust-job-visit.png"
          - "assets/img/illust-job-visit-2.png"
          - "assets/img/illust-job-visit-3.png"
      consultant:
        synonyms:
          - "ケアマネジャー・計画作成担当者"
        images:
          - "assets/img/illust-job-consultant.png"
          - "assets/img/illust-job-consultant-2.png"
      nurse:
        synonyms:
          - "看護職"
          - "看護師"
        images:
          - "assets/img/illust-job-nurse.png"
      office:
        synonyms:
          - "事務職"
        images:
          - "assets/img/illust-job-office.png"
          - "assets/img/illust-job-office-2.png"
      it:
        synonyms:
          - "ITエンジニア職"
          - "開発エンジニア"
        images:
          - "assets/img/illust-job-it.png"
      visiting-nurse:
        synonyms:
          - "訪問看護"
        images:
          - "assets/img/illust-job-visiting-nurse.png"
          - "assets/img/illust-job-visiting-nurse-2.png"
          - "assets/img/illust-job-visiting-nurse-3.png"
      night-shift:
        synonyms:
          - "夜勤専従（介護・看護）"
        images:
          - "assets/img/illust-job-night-shift.png"
          - "assets/img/illust-job-night-shift-2.png"
      facility-manager:
        synonyms:
          - "施設長・管理者候補"
        images:
          - "assets/img/illust-job-facility-manager.png"
      general:
        synonyms:
          - "総合職（営業・管理職）"
        images:
          - "assets/img/illust-job-general.png"
          - "assets/img/illust-job-general-2.png"
      consultation:
        synonyms:
          - "相談員"
        images:
          - "assets/img/illust-job-consultation.png"
          - "assets/img/illust-job-consultation-2.png"
      support:
        synonyms:
          - "サポート職（清掃・洗濯・調理・送迎）"
        images:
          - "assets/img/illust-job-support.png"
      visiting-rehab:
        synonyms:
          - "訪問リハビリ"
        images:
          - "assets/img/illust-job-visiting-rehab.png"
      service-manager:
        synonyms:
          - "サービス管理責任者"
        images:
          - "assets/img/illust-job-service-manager.png"
      caretaker:
        synonyms:
          - "世話人"
        images:
          - "assets/img/illust-job-caretaker.png"
      service-lead:
        synonyms:
          - "サービス提供責任者"
        images:
          - "assets/img/illust-job-service-lead.png"
      new-grad:
        synonyms:
          - "新卒・既卒総合職"
        images:
          - "assets/img/illust-job-new-grad.png"
    default_image: "assets/img/illust-job-default.png"

sanitize:
  allowed_tags:
    - "p"
    - "br"
    - "ul"
    - "ol"
    - "li"
    - "strong"
    - "em"
    - "b"
    - "i"
    - "h2"
    - "h3"
    - "h4"
  drop_tags:
    - "script"
    - "style"
    - "form"
    - "iframe"
    - "object"
    - "embed"
