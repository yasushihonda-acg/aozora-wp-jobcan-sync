[project]
name = "aozora-sync"
version = "0.1.0"
description = "Aozora ACG Phase B - Jobcan public page proxy with in-house template re-rendering"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "pydantic>=2.5.0",
    "jinja2>=3.1.0",
    "bleach>=6.1.0",
    "typer>=0.12.0",
    "pyyaml>=6.0.3",
    "fastapi>=0.137.2",
    "uvicorn>=0.49.0",
    "cachetools>=7.1.4",
    "google-cloud-firestore>=2.19.0",
    "google-cloud-secret-manager>=2.20.0",
]

[project.optional-dependencies]
# CSV-migration follow-up (2026-08-11): only `jobcan_ats.py` imports
# playwright, and only inside its command bodies (`cli.py`'s `ats-download`),
# never at module level — the request-serving image (`sync/Dockerfile`) and
# every other environment (tests, `sync-run`, `sync-run-csv --csv-file`)
# never install this extra. See `sync/Dockerfile.job` for the Job-only image
# that does.
#
# Pinned EXACT, not `>=`: `sync/Dockerfile.job`'s base image
# (`mcr.microsoft.com/playwright/python:vX.Y.Z-noble`) bundles one specific
# Chromium build per Playwright release, and the pip package refuses to
# launch a browser when its own version doesn't match the installed browser
# exactly (confirmed the hard way — a `>=1.49.0` floor let pip resolve a
# newer 1.62.0 than the 1.49.0-pinned base image shipped, 2026-08-11 second
# real deploy attempt). Bump this version and Dockerfile.job's tag together,
# never one without the other.
ats = ["playwright==1.62.0"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "respx>=0.21.0",
    "ruff>=0.7.0",
    "pyright>=1.1.380",
    "freezegun>=1.5.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sync"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "RUF"]
# RUF001/2/3 flag ambiguous Unicode (full-width vs half-width). Japanese-language
# fixtures and test assertions legitimately contain CJK punctuation, so we mute
# these rules globally — the codebase is bilingual by design.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["src", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v --tb=short"
